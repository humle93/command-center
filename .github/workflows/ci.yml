name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx  # httpx: only for FastAPI TestClient in the tests
      - name: install.sh is generated from the repo
        run: python3 scripts/build_installer.py --check
      - name: Boot, sweep pages, test the Autopilot bridge
        run: bash tests/ci_check.sh
      - name: Quality gate, API budget, health
        run: python3 tests/test_v8_features.py
      - name: Every env var read by the code is documented in .env.example
        run: python3 tests/test_config_drift.py
