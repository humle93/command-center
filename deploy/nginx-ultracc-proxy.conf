# Command Center paa Ultra.cc - almindeligt login via serverens egen nginx (ingen Cloudflare-tunnel)
#
# Ultra.cc giver ikke et eget domaene til en egen app, kun en understi paa din faste adresse:
#     https://<bruger>.<server>.usbx.me/cc/
# Denne fil er derfor KUN location-blokke (ingen server { }): Ultra.cc's nginx indlaeser dem selv inde
# i sin egen https-server.
#
# Saadan bruges den (v7.28+):
#   1. Find en ledig port:            app-ports free          (fx 12345)
#   2. .env i ~/command-center:       CC_HOST=127.0.0.1
#                                     CC_PORT=12345
#                                     CC_PUBLIC_URL=https://<bruger>.<server>.usbx.me/cc
#   3. Kopier filen og ret porten:    cp deploy/nginx-ultracc-proxy.conf ~/.apps/nginx/proxy.d/command-center.conf
#                                     sed -i 's/12345/<din port>/' ~/.apps/nginx/proxy.d/command-center.conf
#   4. Genindlaes nginx:              app-nginx restart
#   5. Genstart appen:                bash scripts/restart.sh
#   6. Aabn                           https://<bruger>.<server>.usbx.me/cc/   -> login-siden
#
# Stien /cc kommer fra CC_PUBLIC_URL (eller CC_BASE_PATH). Vil du bruge en anden sti, skal den rettes
# baade her (tre steder) og i .env. Appen fjerner selv /cc fra indgaaende kald og saetter det paa links,
# redirects og session-cookien, saa nginx skal IKKE strippe stien (ingen "/" efter porten i proxy_pass).

location = /cc {
    return 301 /cc/;
}

location /cc/ {
    proxy_pass http://127.0.0.1:12345;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Fast "https": adressen paa usbx.me er altid https, ogsaa naar Ultra.cc's front-proxy taler http
    # med din nginx. Uden den bliver session-cookien ikke Secure, og UI'et viser en HTTPS-advarsel.
    proxy_set_header X-Forwarded-Proto https;

    # Crawl, content gap og AI-kald kan tage minutter - ellers 504.
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering       off;
    client_max_body_size  4m;
}
